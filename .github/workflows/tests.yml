name: Reliability checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/tested-constraints.txt
      - run: brew install ffmpeg
      - run: python -m pip install -r requirements.txt -c requirements/tested-constraints.txt
      - run: python -m compileall -q core gui utils main.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n packaging/build.sh packaging/make_dmg.sh
